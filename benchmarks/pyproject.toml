[project]
name = "mnemo-benchmarks"
version = "0.1.0"
description = "Internal benchmark harness for Mnemo. Five baselines: LongMemEval, Corr2Cause+CLadder, LOCOMO, GraphRAG-Bench, CronQA."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.10.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
