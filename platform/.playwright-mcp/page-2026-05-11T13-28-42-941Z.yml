                - text: "Nmemo's knowledge architecture rests on one foundational split:"
                - emphasis [ref=e159]: what is true and when
                - text: is a different kind of knowledge than
                - emphasis [ref=e160]: why it became true
                - text: — and each kind demands its own graph. Graph S is a temporal state graph, tracking entities and bi-temporal facts with full historical precision. Graph C is a perpendicular causal graph, recording the reasoning chains that explain why states change.
              - paragraph [ref=e161]:
                - text: These two graphs are not layered — one on top of the other — they are
