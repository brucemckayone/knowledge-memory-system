              - heading "What Graph S Cannot Tell You" [level=3] [ref=e237]
              - paragraph [ref=e238]:
                - text: Graph S gives you extraordinary precision over
                - emphasis [ref=e239]: what was true and when
                - text: . You can reconstruct exactly what the system believed about any entity at any transaction timestamp, correct facts retroactively without losing history, and query across two independent time axes. That is genuinely powerful — and it is genuinely insufficient.
              - paragraph [ref=e240]: "Consider two facts Graph S records without complaint:"
              - list [ref=e241]:
                - listitem [ref=e242]:
                  - code [ref=e243]: "Alice — role: Engineer at OrgX"
                  - text: (valid from 2023-01-01)
                - listitem [ref=e244]:
                  - code [ref=e245]: "Alice — role: Senior Engineer at OrgX"
                  - text: (valid from 2024-06-01)
              - paragraph [ref=e246]:
                - text: Graph S stores both. It can tell you precisely when each was recorded and when each was valid. What it cannot tell you is
                - strong [ref=e247]: why the second fact exists
                - text: . Was it a promotion? A re-org? A data correction? A merger that reclassified all Engineering titles? Graph S has no schema for that relationship. The two facts sit side-by-side in the bi-temporal model with no causal edge connecting them.
              - paragraph [ref=e248]: "This gap has three concrete faces:"
              - list [ref=e249]:
                - listitem [ref=e250]:
                  - strong [ref=e251]: No causal chain.
                  - text: Graph S records state transitions but has no structure to represent that one event
                  - emphasis [ref=e252]: caused
                  - text: another.
                - listitem [ref=e253]:
                  - strong [ref=e254]: No reasoning trace.
                  - text: There is no field in any of Graph S's seven tables that holds the inference or argument behind a fact — just the fact itself and its timestamps.
                - listitem [ref=e255]:
                  - strong [ref=e256]: No source attribution at the edge level.
                  - text: You can attach a source to a fact, but you cannot record
                  - emphasis [ref=e257]: which combination of sources and prior facts, taken together, justified a new belief
                  - text: .
              - paragraph [ref=e258]:
                - text: These are not oversights in the schema — they are fundamental to what a temporal state graph is
                - emphasis [ref=e259]: for
                - text: . A new dimension of knowledge is needed to answer the 'why', and that is precisely what Graph C provides.
            - generic [ref=e260]:
              - 'heading "Graph C: The Causal Dimension" [level=3] [ref=e261]'
              - paragraph [ref=e262]:
                - text: "Graph C answers the question Graph S structurally cannot:"
                - emphasis [ref=e263]: why did this fact come to be?
                - text: "Where Graph S is a temporal record of state — what was true, and when — Graph C is a causal record of reasoning: the chain of evidence and inference that explains state changes."
              - paragraph [ref=e264]:
                - text: "The one-sentence definition:"
                - strong [ref=e265]: Graph C is an append-only causal graph whose edges encode the reasoning chains and source attribution that explain why entities and facts in Graph S changed.
              - paragraph [ref=e266]: "Every causal edge in Graph C connects two events and carries exactly two non-negotiable fields:"
              - list [ref=e267]:
                - listitem [ref=e268]:
                  - strong [ref=e269]:
                    - code [ref=e270]: reasoning TEXT NOT NULL
                  - text: — a human-readable (and LLM-generated) explanation of the causal link. This cannot be empty. A causal edge without reasoning is structurally indistinguishable from a coincidence.
                - listitem [ref=e271]:
                  - strong [ref=e272]:
                    - code [ref=e273]: source_references JSONB NOT NULL
                  - text: "— the traceable evidence: document IDs, memory IDs, timestamps, and any other provenance that grounds the reasoning in real source material. Without this, the reasoning is unverifiable."
              - paragraph [ref=e274]: These are schema constraints, not optional metadata. Dropping either field collapses Graph C's entire value proposition — you'd have an assertion with no argument and no evidence.
              - heading "Why 'Perpendicular' Is Architecturally Accurate" [level=3] [ref=e275]
              - paragraph [ref=e276]: It's tempting to picture Graph C as a layer sitting on top of Graph S — a kind of annotation or enrichment pass. That framing is wrong, and the wrong framing leads to wrong design decisions.
              - paragraph [ref=e277]:
                - text: "Consider the axes from the diagram above. Graph S extends horizontally: a fact node has a left-pointing history and a right-pointing future, all along the time axis. You can travel arbitrarily far in either direction and still be answering the same kind of question —"
                - emphasis [ref=e278]: what was the state at time T?
              - paragraph [ref=e279]:
                - text: Graph C extends vertically from the same fact node. Moving along the causal axis answers a categorically different question —
                - emphasis [ref=e280]: what caused this state?
                - text: No matter how far you travel along the time axis, you never arrive at a causal explanation. No matter how deep you follow a causal chain, you never arrive at a timestamp. The two dimensions are orthogonal by definition.
              - paragraph [ref=e281]:
                - text: "This orthogonality has a concrete architectural consequence: a causal edge does not replace or modify a fact in Graph S. It references that fact from a perpendicular direction. Graph S remains the authoritative record of"
                - emphasis [ref=e282]: what is true
                - text: ; Graph C is the authoritative record of
                - emphasis [ref=e283]: why it became true
                - text: . Neither graph makes the other redundant.
