            - paragraph [ref=e335]: "You now hold the single mental split that underpins the entire course: Graph S owns truth and time, Graph C owns causality and reasoning. Every schema decision, pipeline step, and query pattern in the sections ahead reduces to one question — which graph is the right home for this piece of knowledge, and how do the two graphs communicate? In Section 2 you'll move from mental model to mechanics, examining exactly how a causal event is structured, what makes an audit trail genuinely append-only, and why the reasoning and source_references fields are non-negotiable constraints rather than optional metadata."
