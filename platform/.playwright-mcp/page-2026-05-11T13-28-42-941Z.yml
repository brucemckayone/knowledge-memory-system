                  - generic [ref=e471]: "You're right that Graph S stores state and Graph C stores causality — that's the correct starting point. But here's the critical gap: Graph C isn't optional elegance or a schema choice. It solves a fundamentally different question that a 'reason' column cannot answer. Here's why: A single reason column only works if each fact has exactly one cause. In reality, causality is a *network*. One causal event (e.g., \"user was added to role\") may cause *multiple* facts to change (user's permissions update, audit log entry appears, notification sent). And conversely, one fact might be the consequence of *multiple* prior events. Graph C is a directed graph of *causal events*, not a denormalized column — it captures this many-to-many relationship that a schema column simply cannot express. The \"perpendicular\" design is the insight: Graph S answers 'what is true at time T?' by recording state transitions with bi-temporal timestamps. Graph C cuts *across* those state transitions and asks 'why did this change?' with full causal reasoning + source references. They're orthogonal dimensions of an epistemological record — the temporal audit AND the causal explanation. Without bi-temporal facts (Graph S foundation), you can't even know when things changed. Without causal reasoning (Graph C layer), you can't explain why. One column does neither; two graphs together give you complete traceability. Before moving forward, take a step back and study **Bi-temporal Fact Representation** — understand how valid_at and transaction_at timestamps work. That's the foundation that makes the dual-graph separation necessary."
