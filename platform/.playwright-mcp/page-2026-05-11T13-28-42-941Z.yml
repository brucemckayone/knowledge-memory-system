            - generic [ref=e163]:
              - paragraph [ref=e164]:
                - text: "Imagine you've built a knowledge graph with perfect temporal fidelity. Every fact about every entity is timestamped twice — once for when it was true in the real world, once for when your system recorded it. You can ask:"
                - emphasis [ref=e165]: What did we know about Alice's role on 2023-12-01, using only information recorded before that date?
                - text: The system answers without hesitation.
              - paragraph [ref=e166]:
                - text: "Now ask a different kind of question:"
                - emphasis [ref=e167]: Why did Alice's role change?
              - paragraph [ref=e168]:
                - text: The graph goes silent. Not because the data is missing — the old role, the new role, and both timestamps are all there. The graph is silent because
                - strong [ref=e169]: temporal precision and causal explanation are different kinds of knowledge
                - text: ", and a state graph is only built for one of them."
              - paragraph [ref=e170]: "This gap is not a bug you can patch by adding a column. Consider what answering 'why' actually requires:"
              - list [ref=e171]:
                - listitem [ref=e172]: A traceable chain of events that preceded the state change
                - listitem [ref=e173]: The reasoning that connects those events to the new state
                - listitem [ref=e174]: References to the sources that justified that reasoning
                - listitem [ref=e175]: A way to query across multiple such chains to find patterns
              - paragraph [ref=e176]:
                - text: None of those things fit naturally into a fact row with valid and transaction timestamps. You could force them in — a
                - code [ref=e177]: reason
                - text: varchar here, a
                - code [ref=e178]: source
                - text: text field there — but the moment two facts are causally linked, or a single cause produces a cascade of state changes, the relational shoehorn breaks. You end up with either NULLs, denormalized JSON blobs, or a shadow schema bolted to the side of your carefully designed temporal tables.
              - paragraph [ref=e179]:
                - text: The right response is to recognize that temporal state and causal reasoning are
                - emphasis [ref=e180]: orthogonal dimensions
                - text: of knowledge. They share anchor points — a fact node is where they meet — but each extends in a direction the other cannot express. That geometric intuition is what the dual-graph architecture makes precise.
