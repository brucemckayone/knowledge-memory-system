                  - generic [ref=e507]: "You've got the core intuition right — canonical data lives in PostgreSQL, and AGE provides fast graph traversal on top. That's exactly the separation-of-concerns principle at work. Your description of it as 'helps walk them faster' is spot-on. Here's the missing piece: 'traversal index' is specific because of an AGE gotcha. When you write `MERGE (a)-[r:REL]->(b) SET r.prop = value`, AGE creates the edge but *silently drops the SET for edge properties*. Node properties work fine, but edge attributes get lost. This is the crucial reason the design stores causal edge properties (reasoning, confidence, status) in PostgreSQL's `causal_edges` table, NOT in AGE edges. If you only trusted AGE for causal reasoning metadata, you'd lose data. By keeping the truth in Postgres and using AGE only for traversal, Graph C is immune to this bug. So the distinction matters not just for query performance, but for data integrity: PostgreSQL = guaranteed truth. AGE = fast navigation. Separate concerns, complementary roles."
