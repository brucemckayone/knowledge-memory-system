                - strong [ref=e191]: Transaction time
                - text: is when your system recorded that fact — you ingested the data on 2023-01-15. These two clocks are independent. A fact can be valid for years before you record it. A correction you make today can backdate the valid-time range to last year. Querying along each axis independently is what makes the model bi-temporal rather than just timestamped.
