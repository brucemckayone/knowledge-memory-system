              - heading "Why Graph S Must Be Proven Before Graph C Can Be Built" [level=3] [ref=e287]
              - paragraph [ref=e288]:
                - text: The concept map above shows two graphs that communicate — causal edges in Graph C
                - emphasis [ref=e289]: explain
                - text: "facts in Graph S. That communication channel is only as trustworthy as the facts at the other end of it. This is the Phase Gate rule: Graph S must pass a full regression test before a single line of Graph C code is written."
              - paragraph [ref=e290]: "The regression — called the Frankenstein test in the codebase — validates three specific Graph S capabilities:"
              - list [ref=e291]:
                - listitem [ref=e292]:
                  - strong [ref=e293]: Entity deduplication.
                  - text: When the same real-world entity appears under different surface forms ("Alice Smith", "A. Smith", "
                  - link "alice@orgx.com" [ref=e294] [cursor=pointer]:
                    - /url: mailto:alice@orgx.com
                  - text: "\"), Graph S must resolve them to one canonical node. Without that, the graph accumulates phantom duplicates."
                - listitem [ref=e295]:
                  - strong [ref=e296]: Relationship matching.
                  - text: When two facts reference the same relationship under variant phrasings ("reports to" / "direct report of"), the system must recognise the match rather than create separate edge types.
                - listitem [ref=e297]:
                  - strong [ref=e298]: Fact deduplication.
                  - text: When the same fact arrives more than once — identical content, different ingestion events — Graph S must suppress the duplicate, not insert a second row.
              - paragraph [ref=e299]:
                - text: Now consider what happens if any of these fail and you build Graph C on top anyway. A causal edge connects two nodes. If entity deduplication is broken, those nodes may be phantoms — duplicate representations of the same real-world entity. The causal edge then describes a relationship between a ghost and its twin. Querying
                - emphasis [ref=e300]: why
                - text: Alice's role changed returns reasoning about
                - code [ref=e301]: Alice Smith (node 42)
                - text: that has nothing to do with facts recorded under
                - code [ref=e302]: A. Smith (node 17)
                - text: .
              - paragraph [ref=e303]: "Fact deduplication failures are equally corrosive: duplicate facts generate spurious causal event candidates, and the causal agent assigns reasoning to state changes that never actually occurred."
              - paragraph [ref=e304]: The Phase Gate is not bureaucratic caution — it is a structural constraint. A causal graph built on an unreliable state graph is not a knowledge system. It is a confident fabrication.
