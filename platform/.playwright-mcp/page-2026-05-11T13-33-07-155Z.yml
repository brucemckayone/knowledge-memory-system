                  - generic [ref=e882]: "You're on the right track recognizing that events and edges are *different kinds of things*, but the distinction isn't about two schemas — it's about **observation vs. inference**. Here's the key: a causal *event* is an immutable ground-truth **record of what happened**. When you ingest a text saying 'Alice was promoted to VP', the pipeline automatically logs a causal event: 'memory M was ingested, entity Alice was extracted, role fact was created at time T'. This event is append-only and never changes — it's the audit trail. A causal *edge*, by contrast, is a **reasoned assertion** created *after* the fact by the Haiku agent. The agent reads multiple events, reasons over entity histories and extracted facts, then proposes: 'Alice's mentorship CAUSED her promotion'. This edge has **reasoning** and **source references** attached. Crucially, edges have a lifecycle — they can be proposed, confirmed, superseded, or retracted as new information arrives. You can always replay edges from events if reasoning improves. In your example: ingesting 'Alice was promoted' creates an *event* (automatic, immutable). The agent then *reasons* and asserts an *edge* claiming what caused the promotion (reasoned, potentially revisable). The edge doesn't point from the event to the fact — rather, the event *records* the fact's creation, and the edge asserts a *causal relationship* between entities or facts based on reasoning. This separation means you keep ground truth (events) separate from inference (edges), which is essential for auditability and reasoning improvement. **Focus on this observation-vs-inference distinction next, and re-read Section 2 on the append-only audit trail property.**"
