                  - generic [ref=e898]: "You've got the general flow right—ingest() does call store() and then extract()—and you correctly intuited that the conditional trigger checks how many facts were created. But there are two critical gaps here. **Timing matters:** The causal event is NOT emitted when individual facts are inserted. It's emitted *after extract() completes* as a single atomic event. Why? Because we need to know the complete set of entities and facts that were created or matched before we can emit an event that references them. If we emitted on each fact insertion, we'd have partial events with incomplete entity references, which breaks our source traceability chain. **Data capture:** The event must capture four pieces of information: (1) the **memoryId**—this is the link back to the raw source text stored in Qdrant, critical for `source_references` in causal edges; (2) **entity IDs** created or matched; (3) **fact IDs** created; and (4) the **extraction trigger type** (one of three signals: existing causal history, fact count threshold, or explicit causal language in text). This event then becomes the input to the conditional trigger check, which decides whether to invoke the causal agent. Read **04-sparse-branch-design.md section on the causal agent conditional logic** to nail down the three trigger signals. Next, focus on understanding why the memoryId matters for building source_references chains in causal edges."
