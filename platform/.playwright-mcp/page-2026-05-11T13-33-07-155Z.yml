                  - generic [ref=e890]: "You got the core principle right—append-only prevents rewriting history and ensures transparency. Your git analogy is spot-on: just like git preserves every commit, the causal_events table permanently records every observation the system makes. That's exactly the security and auditability angle you articulated. But the question asks for *specific capabilities* that append-only enables, and you hit only one of the four. Here's what you missed: (1) **Full audit reconstruction**: You can trace backwards from any causal edge to see the exact sequence of events and reasoning that led to it. (2) **Replay**: If a better causal model is developed, you can re-run the agent over the same raw events without losing data—the old edges stay in history, the new edges are added. (3) **Contradiction detection**: When conflicting observations exist (\"A causes B\" vs \"B causes A\"), they're both visible in the log side-by-side. With update-in-place, one would just overwrite the other silently. (4) **Temporal provenance**: You can see exactly *when* the system learned a relationship, which matters for reasoning about when evidence arrived. The underlying pattern here is *event sourcing*—separate the immutable event log (causal_events) from the materialized view (causal_edges, what we currently believe). This separation is what makes correction and contradiction detection possible. Focus on understanding event sourcing next, and the four capabilities will click into place."
