                  - generic [ref=e1362]: "You nailed the core concept—edges progress through `proposed` → `confirmed` → `superseded`, and the system preserves old edges in the table for audit trail rather than deleting them. That's exactly right. You also correctly identified that superseded edges reference the new edge that replaced them, which is critical for tracing how the system's understanding evolved. Here's what completes the picture: The question specifically asked *what triggers each transition*, and that's where the specifics live. **Proposed → Confirmed** happens when additional corroborating evidence arrives (e.g., subsequent causal events reference the same entity pair, or a human reviewer validates the edge). **Confirmed → Superseded** happens when a *later, higher-confidence edge* covering the same cause-effect relationship is asserted—the old edge is marked with a supersession reference, not deleted. There's also a **Refuted** status (which you didn't mention) that can be asserted if strong contradicting evidence arrives. The key detail: initial proposed edges have confidence *below* 0.9 until corroboration arrives. Confirmation is about *evidence accumulation and threshold crossing*, not just \"it seems solid.\" This is what makes the system debuggable—you can always replay how the AI's certainty changed. Next time, focus on naming the **specific triggers** for each state transition: what has to happen (new evidence? human input? confidence milestone?) for the edge to move from one status to the next. That's the operational definition of the lifecycle. You're clearly comfortable with the append-only model and audit trail concept—now tie it to the *conditions* that drive the transitions."
