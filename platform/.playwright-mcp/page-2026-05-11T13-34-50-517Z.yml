                  - generic [ref=e1370]: "You got the core intuition right: source_references is an array of objects that point to something specific, and vague references are worse than useless for audit trails. But you're missing three critical fields that make traceability actually work. Your answer conflated all reference types into a single `doc_id` field. In reality, each object needs: **(1) memoryId** — the ID of the raw source text in Qdrant/Postgres (this is what lets you retrieve the original text), **(2) entityIds** — an **array** of Graph S entity IDs that the edge references (not a single ID), **(3) factIds** — an **array** of Graph S fact IDs that were considered, and **(4) excerpt** — optional but crucial, the specific text span that justified the edge. This is why JSONB is used: it's flexible enough to handle 1 memory + 3 entities + 2 facts *or* 10 memories + 0 entities + 15 facts, while staying queryable with PostgreSQL's `->` and `@>` operators for audit queries. Full traceability has three parts: (1) Use memoryId to retrieve the original raw text from Qdrant. (2) Look up the entity and fact records in Graph S tables — these are separate records with their own IDs. (3) Verify the agent's reasoning text in the causal edge is consistent with all the records you just retrieved. Without all three, the reference is incomplete — you can't close the loop from edge back to evidence. Right now you understand step 1 (get the text) but you're missing the Graph S prerequisite — entities and facts are distinct, independently queryable records, not tags."
