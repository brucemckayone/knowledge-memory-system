                  - generic [ref=e1378]: "You're on the right track—you correctly identified that search_path and schema placement are central to the issue, and you sensed AGE's involvement. That intuition is good foundation. But you're missing two critical pieces that complete the picture. Here's the full mechanism: When migration 001 runs `SET search_path = ag_catalog, public, \"$user\"` at the session level, that search_path **persists to the next migration file** (002) running in the same `psql` session. Without explicit schema qualifiers, any unqualified `CREATE TABLE` lands in the first schema in the path—which is `ag_catalog`. So `CREATE TABLE causal_edges` becomes a table in `ag_catalog`, not `public`. Then when you write `REFERENCES facts(id)`, PostgreSQL looks up `facts` in the search path, finds `ag_catalog.facts` (which doesn't exist), and the FK fails—migration broken. You can't fix this by changing search_path in migration 002 because **AGE's `cypher()` function and Graph S's trigger functions depend on ag_catalog being in the path**. Changing it would break existing triggers and the graph traversal. So explicit qualifiers (`public.causal_edges`, `public.REFERENCES public.facts(id)`) are the only solution—they override the search_path and guarantee tables land in the right schema. Go back to `CLAUDE.md` section \"AGE / search_path Gotchas\" and read it in full. This is a subtle but unavoidable detail in this architecture."
