            - paragraph [ref=e460]: "You now have an exact vocabulary for all six primitives. Bi-temporal facts let you query both what was true in the world and what the system believed, independently. Causal edges carry mandatory reasoning traces that make every inference auditable. The reasoning patrol fires conditionally — blast radius, contradiction, pattern — only when graph state warrants it. Four topology metrics each unlock a different structural inference about the knowledge graph's shape. Entity resolution keeps the graph clean enough for those metrics to be meaningful. And confidence decay surfaces stale beliefs before they corrupt downstream causal reasoning. Section 2 applies this vocabulary directly: when it claims the system can trace every project decision to its causal antecedents, you will know which tables, fields, and agent operations carry that claim."
          - generic [ref=e461]:
            - heading "Key takeaways" [level=3] [ref=e462]
            - list [ref=e463]:
              - listitem [ref=e464]: Bi-temporal facts separate valid_time (world truth) from recorded_time (system knowledge), enabling retroactive corrections.
              - listitem [ref=e465]: Graph S queries state (what was true); Graph C queries causality (why changed)—different schemas, different agents.
              - listitem [ref=e466]: Every causal edge requires mandatory reasoning trace and source_references field—zero inferred causality without documented reasoning.
              - listitem [ref=e467]: Entity resolution maintains graph cleanliness, making topology metrics (k-core, articulation points) yield valid structural inferences.
              - listitem [ref=e468]: Apache AGE is a traversal index only; PostgreSQL tables remain canonical source of truth.
              - listitem [ref=e469]: Confidence scores decay exponentially on facts, surfacing stale beliefs before they corrupt causal reasoning downstream.
