              - heading "Entity Resolution and the Gardener" [level=3] [ref=e406]
              - paragraph [ref=e407]: Topology metrics are only as meaningful as the entity graph they operate on. If "Alice Chen" and "A. Chen" exist as separate nodes, every k-core and community score is subtly wrong — the graph has split one hub into two half-populated stubs. Entity resolution is the mechanism that prevents this.
              - paragraph [ref=e408]: Resolution runs in two stages.
              - paragraph [ref=e409]:
                - strong [ref=e410]: Stage 1 — Deterministic blocking.
                - text: "Before any vector math, the system generates candidate pairs using cheap deterministic signals: shared tokens in entity names, matching external identifiers (email addresses, project IDs, canonical slugs), and overlapping metadata attributes. Blocking limits the comparison space — you don't score every entity pair against every other, only pairs that already share at least one hard signal. This keeps the pipeline tractable as the graph grows."
              - paragraph [ref=e411]:
                - strong [ref=e412]: Stage 2 — Embedding similarity ranking.
                - text: Each entity carries a 768-dimensional vector produced by the
                - code [ref=e413]: nomic-embed-text
                - text: "model. For every candidate pair from Stage 1, the system computes cosine distance between the two vectors. Pairs that score above a configurable threshold are flagged as likely duplicates. The threshold is the key tunable: too low and distinct entities merge; too high and genuine duplicates survive."
              - heading "The Reconcile Operation" [level=3] [ref=e414]
              - paragraph [ref=e415]:
                - text: When a merge is confirmed,
                - code [ref=e416]: reconcile
                - text: "does three things in order:"
