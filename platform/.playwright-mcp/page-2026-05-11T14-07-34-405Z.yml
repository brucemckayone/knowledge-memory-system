            - generic [ref=e256]:
              - paragraph [ref=e257]: "Every capability claim in this course traces back to a specific primitive: a schema field, a service function, a trigger condition. This section builds that map precisely. You will encounter six load-bearing mechanisms — bi-temporal facts, causal edges, the reasoning patrol, topology metrics, entity resolution, and confidence decay — each defined at the level of the schema or service file that implements it."
              - paragraph [ref=e258]: The goal is a working vocabulary, not a tour. When Section 2 argues that this system can reconstruct the causal chain behind any project decision, you will already know which tables, agent operations, and decay signals carry that claim — and which don't.
            - generic [ref=e259]:
              - paragraph [ref=e260]: "The six primitives covered in this section aren't aspirational descriptions — each corresponds to a specific schema field or named service operation. Before any mechanism is claimed, it exists in the implementation: a column in a PostgreSQL table, a function in a service file, a trigger condition in code. That's the contract this section holds."
              - paragraph [ref=e261]:
                - text: The system separates into two graphs for a precise reason.
                - strong [ref=e262]: Graph S
                - text: "is the temporal state layer: bi-temporal facts stored in PostgreSQL, with Apache AGE serving as a traversal index over those entities. It records"
                - emphasis [ref=e263]: what was true in the world
                - text: and
