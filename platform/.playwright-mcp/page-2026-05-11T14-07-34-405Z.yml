                  - code [ref=e419]: entity_id
                  - text: as canonical and marks the other as superseded
                - listitem [ref=e420]:
                  - text: Re-points every
                  - code [ref=e421]: facts
                  - text: row referencing the duplicate
                  - code [ref=e422]: entity_id
                  - text: to the canonical one — the fact history is preserved, just re-attributed
                - listitem [ref=e423]: Updates the Apache AGE traversal index so graph edges follow the same consolidation
              - paragraph [ref=e424]: All three steps must succeed together. A partial reconcile — fact rows updated but the AGE index stale — would produce query results that contradict each other depending on whether you query PostgreSQL or traverse the graph.
              - heading "The Gardener's Ongoing Role" [level=3] [ref=e425]
              - paragraph [ref=e426]: Entity resolution isn't a one-time pass. New ingests continuously introduce text that may reference existing entities under new names or formats. The gardener surfaces fresh resolution candidates, validates proposed merges (accepting or rejecting each pair), and monitors for silent entity drift — the gradual accumulation of near-duplicate nodes that erodes topology accuracy without triggering any explicit error.
              - paragraph [ref=e427]: This is why the gardener is described as a continuous role, not a setup step. The graph's structural health depends on it staying current.
