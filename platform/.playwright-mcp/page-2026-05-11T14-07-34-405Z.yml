                - text: as two independently queryable time dimensions.
                - strong [ref=e265]: Graph C
                - text: "is the perpendicular causal layer: typed events and directed causal edges that capture"
                - emphasis [ref=e266]: why
                - text: state changes, each edge carrying a mandatory reasoning trace and source references.
              - paragraph [ref=e267]: "Treating these as a single \"knowledge graph\" collapses a load-bearing distinction. Graph S answers state questions: what was Alice's role in March 2024? Graph C answers causal questions: why did that role change? The storage schemas differ, the query interfaces differ, and the agent operations that write to each graph differ — because the epistemological questions they answer differ."
              - paragraph [ref=e268]: Confusing the two layers causes real errors in use-case reasoning. Topology metrics (k-core, articulation points) operate over Graph S entity structure; causal path queries operate over Graph C edge chains. Asking Graph S for a causal explanation, or Graph C for a point-in-time state, returns the wrong answer from the wrong layer. The separation isn't architectural preference — it's the mechanism that makes each layer's claims precise.
