              - heading "The Reasoning Agent Patrol" [level=3] [ref=e359]
              - paragraph [ref=e360]: "The causal agent doesn't run on every ingest. It runs when the graph state warrants it — specifically, when any one of three conditions is true:"
              - list [ref=e361]:
                - listitem [ref=e362]:
                  - strong [ref=e363]: At least one entity referenced by the new memory already has causal history.
                  - text: If the entity appears in existing
                  - code [ref=e364]: causal_events
                  - text: rows, the incoming text may extend, contradict, or reinforce chains already in Graph C. The agent checks.
                - listitem [ref=e365]:
                  - strong [ref=e366]: The ingest created more than N new facts.
                  - text: A large fact batch changes graph state significantly enough that new causal relationships become plausible. The threshold N is configurable; crossing it fires the agent regardless of entity history.
                - listitem [ref=e367]:
                  - strong [ref=e368]: The source text contains explicit causal language.
                  - text: Terms like "caused", "resulted in", "because of", and similar constructions are detected in the raw
                  - code [ref=e369]: source_text
                  - text: before extraction. If causal language is present, the agent runs even if the entity is new and the fact count is low.
              - paragraph [ref=e370]: When triggered, the agent executes four operations in sequence.
              - paragraph [ref=e371]:
                - strong [ref=e372]: Blast radius traversal.
                - text: Starting from the new fact's entity, the agent walks outward through Graph C to identify downstream beliefs that depend on that entity's state. If the incoming fact changes what's true about the entity — even subtly — beliefs built on earlier assumptions about that entity may now be miscalibrated. The traversal surfaces them before the edge is written.
              - paragraph [ref=e373]:
                - strong [ref=e374]: Contradiction detection.
                - text: For each candidate edge the agent wants to assert, it checks whether an existing causal edge already makes a conflicting claim. A candidate asserting "A caused B" conflicts with an existing edge asserting "A prevented B". The agent surfaces the conflict rather than silently overwriting it — both edges remain visible, with their respective reasoning traces, until a human or later inference resolves them.
              - paragraph [ref=e375]:
                - strong [ref=e376]: Pattern lifecycle update.
                - text: The agent compares the new event against known causal patterns stored in Graph C. If the event matches an existing pattern, it extends the pattern's lifecycle. If it partially matches, it flags a candidate pattern for review. This is how recurring causal structures — "funding cut → scope reduction → delivery delay" — accumulate evidence over time rather than being re-asserted from scratch each cycle.
              - paragraph [ref=e377]:
                - strong [ref=e378]: Edge assertion.
                - text: If the agent proceeds to write an edge, it must populate
                - code [ref=e379]: reasoning TEXT NOT NULL
                - text: and
                - code [ref=e380]: source_references JSONB NOT NULL
                - text: on that row — the same non-negotiable fields the schema enforces on every causal edge. The graph never receives an assertion without a traceable justification; the schema constraint makes that physically impossible, not just a convention.
            - generic [ref=e381]:
              - paragraph [ref=e382]:
                - text: The analytics service exposes four graph topology metrics computed over the AGE traversal index. Each metric is structural — it answers a question about the graph's
                - emphasis [ref=e383]: shape
                - text: ", not its content — and each produces a different class of inference about your knowledge domain."
              - paragraph [ref=e384]:
                - strong [ref=e385]: k-core decomposition
                - text: "assigns every node a coreness score: the largest value"
                - emphasis [ref=e386]: k
                - text: such that the node belongs to a subgraph where every member has at least
                - emphasis [ref=e387]: k
                - text: "neighbours. A node with coreness 5 sits inside a tightly interconnected cluster of at least five mutual connections; a node with coreness 1 hangs off the periphery. The concrete inference: high-coreness entities are the structural influence hubs — the people, projects, or concepts most deeply embedded in the graph's dense core, not just the ones with the most raw connections."
              - paragraph [ref=e388]:
                - strong [ref=e389]: Articulation points
                - text: "are nodes whose removal splits the graph into two or more disconnected components. The algorithm identifies them by traversal: a node qualifies if cutting it isolates at least one other node from the rest of the graph. The concrete inference: an articulation point is a single point of failure for information flow — if that entity record is deleted, corrupted, or drops below a confidence threshold, it severs the graph's connectivity entirely."
              - paragraph [ref=e390]:
                - strong [ref=e391]: Community detection
                - text: "partitions the graph into dense clusters using modularity optimisation. The algorithm maximises edge density within clusters relative to edges between them, producing groups of entities that share more connections with each other than with the rest of the graph. The concrete inference: communities surface knowledge silos or tight collaboration clusters — groups that share facts and causal history but interact sparsely with other groups."
              - paragraph [ref=e392]:
                - strong [ref=e393]: Bridge detection
                - text: "is the edge analogue of articulation points. A bridge is an edge whose removal disconnects graph components; it is the sole path between two otherwise isolated subgraphs. The concrete inference: a bridge edge identifies a critical inter-domain dependency — that single relationship is what connects two knowledge domains, and its absence or degradation fractures them."
              - paragraph [ref=e394]: "These four metrics are not post-hoc analytics bolted on separately. They run over the same AGE traversal index that causal edge queries use, so topology results and causal chains share a consistent structural snapshot. That coupling matters: when the gardener resolves a duplicate entity pair — covered next — every coreness score, articulation point list, and community partition the service has cached becomes stale and must be recomputed. Graph S cleanliness is a direct precondition for topology accuracy."
